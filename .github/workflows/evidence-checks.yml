name: Indoor spatial intelligence evidence checks
on:
  push:
    paths:
      - "studies/indoor_spatial_intelligence/**"
      - ".github/workflows/evidence-checks.yml"
  pull_request:
    paths:
      - "studies/indoor_spatial_intelligence/**"
      - ".github/workflows/evidence-checks.yml"
  workflow_dispatch:
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check manuscript-derived reference targets (not empirical reproduction)
        run: python studies/indoor_spatial_intelligence/scripts/verify.py --mode manifest
      - name: Run evidence verification unit tests
        run: python -m unittest discover -s studies/indoor_spatial_intelligence/tests -v
