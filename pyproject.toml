[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ips-review"
version = "1.0.0"
description = "Reproducibility package for the 25-Years IPS Systematic Review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Mansour" }
]
keywords = ["indoor-positioning", "systematic-review", "reproducibility", "bibliometrics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pre-commit>=3.4",
    "mypy>=1.5",
    "ipykernel>=6.25",
]
figures = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]

[project.urls]
Homepage = "https://github.com/AhmedMansoour/IPS_After_25_Years_Review"
Repository = "https://github.com/AhmedMansoour/IPS_After_25_Years_Review"
Issues = "https://github.com/AhmedMansoour/IPS_After_25_Years_Review/issues"
Documentation = "https://github.com/AhmedMansoour/IPS_After_25_Years_Review/tree/main/docs"

[project.scripts]
ips-review = "ips_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ips_review = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ips_review"]
omit = ["*/figures/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = false
